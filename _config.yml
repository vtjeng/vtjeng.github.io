title: Vincent Tjeng
author: ""
description: Vincent Tjeng's Personal Site
baseurl: "" # the subpath of your site, e.g. /blog
# Link previews need absolute image URLs, and jekyll-seo-tag builds them from `url`. GitHub Pages
# fills `url` in through github-metadata, but the Cloudflare Pages build of vtjeng.com does not.
url: https://vtjeng.com
# Cloudflare Pages redirects `/page.html` to `/page`, so post URLs leave out `.html` to match. Jekyll
# still writes each post to a `.html` file.
permalink: /:categories/:year/:month/:day/:title

## For `jekyll-seo-tag`
# https://github.com/jekyll/jekyll-seo-tag/blob/v2.6.1/docs/usage.md

twitter:
  username: VincentTjeng
  card: summary_large_image

social:
  name: Vincent Tjeng
  links:
    - https://twitter.com/VincentTjeng
    - https://github.com/vtjeng

# https://github.com/jekyll/jekyll-seo-tag/blob/v2.6.1/docs/advanced-usage.md#setting-a-default-image
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/vincent-tjeng-wide.jpg

webmaster_verifications:
  google: m6BwP3x7arDF8eIVihgo63mwrVEZ0d78KW6QPfvP9K0

remote_theme: jekyll/minima@296bf6b872b8450529bee1e48d0ca9be200a4be5

## KaTeX
# KaTeX is a good option that is generally faster: https://gendignoux.com/blog/2020/05/23/katex.html
# However, adding it on GitHub pages is complex: https://karas.io/blog/math-support-with-katex-on-github-pages/, https://github.com/KaTeX/KaTeX/issues/2262
# One of the issues is that the github-pages gem overrides the kramdown math engine. (See https://github.com/github/pages-gem/pull/545 for more.)

exclude: [README.md, functions]

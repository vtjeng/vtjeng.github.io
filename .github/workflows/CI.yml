name: CI

on:
  push:
    branches:
      - "master"
    tags: "*"
  pull_request:

# Cancel previous runs of this workflow for the same pull request
# `github.head_ref`: https://stackoverflow.com/a/67939898/1404966
# `github.run_id`: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-using-a-fallback-value
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# These checks only read repository contents. With this block present, every
# scope not listed is set to none.
permissions:
  contents: read

jobs:
  format-check-prettier:
    name: "Check Formatting (Prettier)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: "Verify that Prettier does not find any code style issues."
        # Without a pin, npx resolves the latest Prettier, and new releases change
        # formatting rules and break CI on unchanged files.
        # renovate: datasource=npm depName=prettier
        run: npx --yes prettier@3.9.7 . --check

  check-route-collisions:
    name: "Check Route Collisions"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # This build only creates _site for the collision check below. It does not
      # upload or deploy the site; GitHub Pages and Cloudflare deploy separately.
      - name: "Build a temporary Jekyll site."
        uses: actions/jekyll-build-pages@v1
      - name: "Check for route collisions."
        run: |
          collision_found=0
          for proxy_path in functions/*/; do
            [[ -d "$proxy_path" ]] || continue
            route=${proxy_path#functions/}
            route=${route%/}
            if [[ -e "_site/$route" || -e "_site/$route.html" ]]; then
              echo "::error::Cloudflare proxy route /$route/ shadows a Jekyll route."
              collision_found=1
            fi
          done
          exit "$collision_found"

  check-link-preview-urls:
    name: "Check Link Preview URLs"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: "Build a temporary Jekyll site."
        uses: actions/jekyll-build-pages@v1
      # Preview services and search engines need absolute URLs, and Cloudflare Pages redirects any
      # URL ending in `.html`, so a canonical URL ending in `.html` points at a redirect.
      - name: "Check that canonical and preview URLs are absolute and do not end in .html."
        run: |
          bad=$(grep -rHoE --include='*.html' \
            '(rel="canonical" href|property="(og:url|og:image|twitter:image)" content)="[^"]*"' _site \
            | awk -F'="' '{ v = $NF; sub(/"$/, "", v); if (v !~ /^https:\/\// || v ~ /\.html$/) print }')
          if [[ -n "$bad" ]]; then
            echo "$bad" | sed 's/^/::error::/'
            exit 1
          fi

  check-blog-preview:
    name: "Check Blog Preview Image"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # Link previews of /blog/ show the latest post's image, which blog.md sets by hand.
      - name: "Check that blog.md uses the latest post's image."
        run: |
          latest=$(ls _posts | sort | tail -n 1)
          # `|| true` keeps a missing image line from ending the script, under `bash -e`, before the
          # error below.
          post_image=$(grep -m 1 '^image:' "_posts/$latest" || true)
          blog_image=$(grep -m 1 '^image:' blog.md || true)
          if [[ -z "$post_image" ]]; then
            echo "::error file=_posts/$latest::Add an image line, which link previews of the post and of /blog/ show."
            exit 1
          fi
          if [[ "$post_image" != "$blog_image" ]]; then
            echo "::error file=blog.md::Copy the image line from _posts/$latest into blog.md: $post_image"
            exit 1
          fi
